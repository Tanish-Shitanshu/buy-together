services:
  - type: web
    name: buy-together
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PAYPAL_ENV
        value: sandbox
      - key: UNDO_SECONDS
        value: 8
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: I18N_DUMP_TOKEN
        sync: false
